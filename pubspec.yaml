name: flutter_music_creator
description: "A feature-first Flutter music creation app with recorder and sequencer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Audio playback / recording
  audioplayers: ^5.2.0
  record: ^5.1.0

  # File system / permission handling
  path_provider: ^2.1.0
  permission_handler: ^11.0.0

  # Reactive programming
  rxdart: ^0.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
